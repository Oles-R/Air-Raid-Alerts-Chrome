# Publishes a GitHub Release (vX.Y.Z tag + zip + that version's CHANGELOG.md
# section as notes) for the version in public/manifest.json. Runs when:
#   - a commit lands on main (e.g. a merged PR) — releases the manifest version
#     if it has no release yet, so bumping the version is all it takes;
#   - a vX.Y.Z tag is pushed by hand — the tag must match the manifest version;
#   - it is started manually (Actions → Release → Run workflow), optionally for
#     an existing tag, e.g. to redo a release that failed.
# Already-released versions are skipped, so re-runs are harmless.
# The Chrome Web Store upload itself is still manual (release/*.zip).
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.5.2). Empty = current manifest version on main'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # build.ps1 / sync-languages.ps1 call Windows PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version and check it isn't released yet
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content public/manifest.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $requested = if ("${{ inputs.tag }}") { "${{ inputs.tag }}" } elseif ("${{ github.ref_type }}" -eq 'tag') { "${{ github.ref_name }}" } else { $null }
          if ($requested -and $requested -ne $tag) {
            throw "Tag $requested does not match manifest.json version $version"
          }

          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) { Write-Host "Release $tag already exists - nothing to do" }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "skip=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        if: steps.version.outputs.skip == 'false'
        with:
          node-version: 24
          cache: npm

      - if: steps.version.outputs.skip == 'false'
        run: npm ci

      - if: steps.version.outputs.skip == 'false'
        run: npm run build

      - name: Extract release notes
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $match = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $match.Success) {
            throw "CHANGELOG.md has no '## $version' section"
          }
          $match.Groups[1].Value.Trim() | Out-File release-notes.md -Encoding utf8

      # --target creates the tag on the built commit when it doesn't exist yet
      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = git rev-parse HEAD
          gh release create "${{ steps.version.outputs.tag }}" (Get-ChildItem release/*.zip).FullName `
            --target $sha `
            --title "${{ steps.version.outputs.tag }}" `
            --notes-file release-notes.md

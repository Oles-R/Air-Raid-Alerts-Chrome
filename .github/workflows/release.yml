# Push a tag like v1.5.2 -> builds the extension and publishes a GitHub Release
# with the zip attached and that version's section of CHANGELOG.md as notes.
# The Chrome Web Store upload itself is still manual (release/*.zip).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # build.ps1 / sync-languages.ps1 call Windows PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check tag matches manifest version and extract release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $manifestVersion = (Get-Content public/manifest.json -Raw | ConvertFrom-Json).version
          if ($version -ne $manifestVersion) {
            throw "Tag v$version does not match manifest.json version $manifestVersion"
          }

          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $match = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $match.Success) {
            throw "CHANGELOG.md has no '## $version' section"
          }
          $match.Groups[1].Value.Trim() | Out-File release-notes.md -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem release/*.zip).FullName `
            --title "${{ github.ref_name }}" `
            --notes-file release-notes.md
